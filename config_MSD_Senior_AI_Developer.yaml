project:
  name: msd_senior_ai_developer_practice
  storage_dir: ./.interview_memory
  log_dir: ./session_logs

models:
  chat_model: gpt-4o
  evaluator_model: gpt-4o
  embedding_model: text-embedding-3-small
  temperature_question: 0.45
  temperature_evaluation: 0.1

runtime:
  max_interviewers: 3
  max_questions: 10
  question_order: round_robin
  print_expected_answer: true
  allow_followups: true
  passing_score: 0.75
  retrieval_k: 6

documents:
  company:
    name: MSD Czech Republic
    website: https://www.msd.cz/en/
  job_description_pdf: data/MSD_Senior_AI_developer_description.pdf
  interview_character_pdf: data/Interview_Character.pdf
  candidate:
    name: Thomas Evangelidis
    cv_pdf: data/Resume_Evangelidis_28.03.2026.pdf
  interviewers:
    - name: Lukas Jindra
      role_hint: Director of Automation - Automation/AI/Software Engineering
      style_hint: Senior automation leader; pragmatic about enterprise delivery, governance, reliability, and operational impact.
      profile_pdfs:
        - data/Lukas_Jindra_LinkedIn_Profile.pdf
      extra_pdfs: []

    - name: Jan Doubrava
      role_hint: Technical Lead at MSD; full-stack engineering, GenAI, RAG, LangChain, AWS, Azure DevOps
      style_hint: Hands-on technical lead; likely to probe architecture, code quality, full-stack integration, RAG trade-offs, and mentoring.
      profile_pdfs:
        - data/Jan_Doubrava_LinkedIn_Profile.pdf
      extra_pdfs: []

    - name: Yaman Ktish
      role_hint: Software & AI Engineering Manager; GenAI product lead; production-grade AI systems
      style_hint: Engineering manager with product and startup experience; likely to probe AI product delivery, team collaboration, and scalable systems.
      profile_pdfs:
        - data/Yaman_Kritsh_LinkedIn_Profile.pdf
      extra_pdfs: []

web_research:
  enabled: true
  provider: tavily
  search_depth: basic
  max_results_per_query: 4
  include_answer: true
  include_raw_content: false
  max_job_skill_queries: 8
  max_interviewer_skill_queries: 3
  skip_research_if_interviewer_registered: true
  company_queries:
    - MSD Czech Republic AI Engineering team Prague generative AI healthcare production ready systems
    - MSD Czech Republic technology AI data science Prague careers

guardrails:
  forbid_name_search: true
  candidate_names:
    - Thomas Evangelidis
  interviewer_names: []
  forbidden_extra_terms: []

prompts:
  interview_goal: >
    Emulate a realistic first-round interview for Senior AI Developer at MSD.
    Based on the interview-character PDF, the first round is mainly an introduction,
    candidate background, and scope of technical experience; include only a few light
    technical probes and reserve deep technical assessment for later rounds.